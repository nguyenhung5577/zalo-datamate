[project]
name = "datamate"
version = "0.1.0"
description = "Offline Vietnamese business-data question answering for Zalo AI Challenge 2026"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datamate"]

[tool.setuptools.package-data]
datamate = ["*.json"]
